name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Python version from the Dockerfile
        id: python
        run: |
          version=$(grep -oP '^FROM python:\K\d+\.\d+' Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing against Python $version (matches the deployed image)"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t sales-ai-agent .
      - name: Check ffmpeg is present for the audio path
        run: docker run --rm --entrypoint ffmpeg sales-ai-agent -version
